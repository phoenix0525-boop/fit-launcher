name: Import verified desktop v0427 bundle
on:
  push:
    branches: ['import/desktop-v0427-transfer']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and transfer the original Git objects
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .codex-import/desktop-v0427.bundle.b64 > "$RUNNER_TEMP/desktop-v0427.bundle"
          echo '4a5f470335d6f470c15b580fffcc8f55c90935f9e2efac7a152aa9c4f8b93e3e  '"$RUNNER_TEMP/desktop-v0427.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/desktop-v0427.bundle"
          git fetch "$RUNNER_TEMP/desktop-v0427.bundle" refs/heads/claude/desktop-takeover-v0427:refs/remotes/bundle/v0427
          test "$(git rev-parse refs/remotes/bundle/v0427)" = '36663b0495aa7ec18cc0e84513f17df421849b11'
          git merge-base --is-ancestor 545b9c93483346fd05e3b2aacfb8d8cfe1107d78 refs/remotes/bundle/v0427
          git push origin refs/remotes/bundle/v0427:refs/heads/import/desktop-v0427-objects
          echo 'Original bundle verified and original commits transferred; no application code executed and no main/A/B refs changed.' >> "$GITHUB_STEP_SUMMARY"
