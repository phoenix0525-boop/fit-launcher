name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIT_SIGNING_AVAILABLE: ${{ secrets.FIT_KEYSTORE_BASE64 != '' && secrets.FIT_KEYSTORE_PASSWORD != '' && secrets.FIT_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing policy check
        run: |
          python scripts/check_signing_policy.py
          python scripts/check_test_signing.py
          python scripts/check_version_progression.py
          python scripts/check_release_configuration.py
          python scripts/check_ui_workflow.py
          python scripts/check_theme_artwork.py
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Build debug APK
        env:
          FIT_TEST_KEYSTORE_BASE64: ${{ secrets.FIT_TEST_KEYSTORE_BASE64 }}
          FIT_TEST_KEYSTORE_PASSWORD: ${{ secrets.FIT_TEST_KEYSTORE_PASSWORD }}
          FIT_TEST_KEY_ALIAS: ${{ secrets.FIT_TEST_KEY_ALIAS }}
        shell: bash
        run: |
          set +x
          export FIT_TEST_KEYSTORE_PATH="$RUNNER_TEMP/vehicle-test.p12"
          trap 'rm -f "$FIT_TEST_KEYSTORE_PATH"' EXIT
          if [ -n "$FIT_TEST_KEYSTORE_BASE64" ] && [ -n "$FIT_TEST_KEYSTORE_PASSWORD" ] && [ -n "$FIT_TEST_KEY_ALIAS" ]; then
            python - <<'PYKEY'
          import os, base64
          from pathlib import Path
          path=Path(os.environ['FIT_TEST_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['FIT_TEST_KEYSTORE_BASE64'],validate=True))
          path.chmod(0o600)
          PYKEY
            ./gradlew --no-daemon assembleDebug
            python scripts/verify_test_certificate.py app/build/outputs/apk/debug/app-debug.apk
            echo 'Debug 測試版：已驗證固定測試憑證；不是正式版。' >> "$GITHUB_STEP_SUMMARY"
          else
            unset FIT_TEST_KEYSTORE_PATH FIT_TEST_KEYSTORE_PASSWORD FIT_TEST_KEY_ALIAS
            ./gradlew --no-daemon assembleDebug
            echo '未使用固定測試金鑰，無法覆蓋安裝' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record verified Debug APK provenance
        shell: bash
        run: |
          python - <<'PYPROVENANCE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          folder = Path('app/build/outputs/apk/debug')
          apk = folder / 'app-debug.apk'
          signer = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'))[-1]
          verified = subprocess.run([str(signer), 'verify', '--verbose', '--print-certs', str(apk)], capture_output=True, text=True, check=True)
          certificates = re.findall(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)', verified.stdout)
          assert len(certificates) == 1, 'Expected one verified APK signing certificate'
          certificate = certificates[0].upper()
          expected = Path('docs/test-certificate.sha256').read_text().strip().replace(':', '').upper()
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          report = dict(versionName='0.4.15', versionCode=22, package='tw.fitcar.launcher', head=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'], sha256=digest, sizeBytes=apk.stat().st_size, certificateSha256=certificate, fixedTestSigning=(certificate == expected), cryptographicVerification='apksigner verify passed', buildType='Debug test only')
          (folder / 'signing-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          (folder / 'app-debug.apk.sha256').write_text(digest + '  app-debug.apk\n')
          (folder / 'certificate-sha256.txt').write_text(certificate + '\n')
          print(json.dumps(report))
          PYPROVENANCE
      - uses: actions/upload-artifact@v4
        with:
          name: fit-launcher-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
            app/build/outputs/apk/debug/signing-provenance.json
            app/build/outputs/apk/debug/certificate-sha256.txt
          if-no-files-found: error
      - name: Build clean unsigned release APK and AAB for policy audit
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace
      - name: Audit release manifest, ABI, debug residue and size
        shell: bash
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$RELEASE_APK" && test -n "$RELEASE_AAB"
          python scripts/check_release_artifact.py --apk "$RELEASE_APK" --aab "$RELEASE_AAB" --report release-artifact-report.json
      - name: Upload release audit report
        uses: actions/upload-artifact@v4
        with:
          name: fit-launcher-release-audit
          path: release-artifact-report.json
          if-no-files-found: error
      - name: Build and verify signed release
        if: env.FIT_SIGNING_AVAILABLE == 'true'
        env:
          FIT_KEYSTORE_BASE64: ${{ secrets.FIT_KEYSTORE_BASE64 }}
          FIT_KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
          FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
          FIT_KEYSTORE_PATH: ${{ runner.temp }}/fit-signing.p12
        shell: bash
        run: |
          trap 'rm -f "$FIT_KEYSTORE_PATH"' EXIT
          python - <<'PYKEY'
          import os, base64
          from pathlib import Path
          path = Path(os.environ['FIT_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['FIT_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PYKEY
          ./gradlew --no-daemon assembleRelease bundleRelease
          python scripts/check_release_artifact.py --apk app/build/outputs/apk/release/app-release.apk --aab app/build/outputs/bundle/release/app-release.aab --report signed-release-artifact-report.json
          python scripts/verify_release_certificate.py app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload verified signed release
        if: env.FIT_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fit-launcher-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.certificate.txt
            app/build/outputs/bundle/release/app-release.aab
            signed-release-artifact-report.json
          if-no-files-found: error
      - name: Release signing not configured
        if: env.FIT_SIGNING_AVAILABLE != 'true'
        run: echo "Formal release skipped because required signing configuration is unavailable. Debug artifact is a test build only."
