name: Prepare signed update release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify with existing production certificate
        env:
          FIT_KEYSTORE_BASE64: ${{ secrets.FIT_KEYSTORE_BASE64 }}
          FIT_KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
          FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
          FIT_KEYSTORE_PATH: ${{ runner.temp }}/fit-signing.p12
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIT_KEYSTORE_BASE64" && test -n "$FIT_KEYSTORE_PASSWORD" && test -n "$FIT_KEY_ALIAS" || { echo 'Existing production signing secrets are required; no release was published.'; exit 1; }
          trap 'rm -f "$FIT_KEYSTORE_PATH"' EXIT
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path(os.environ['FIT_KEYSTORE_PATH'])
          p.write_bytes(base64.b64decode(os.environ['FIT_KEYSTORE_BASE64'], validate=True))
          p.chmod(0o600)
          PY
          python scripts/check_signing_policy.py
          python scripts/check_version_progression.py
          python scripts/check_release_configuration.py
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease
          python scripts/verify_release_certificate.py app/build/outputs/apk/release/app-release.apk
          python scripts/check_release_artifact.py --apk app/build/outputs/apk/release/app-release.apk --aab app/build/outputs/bundle/release/app-release.aab --report release-artifact-report.json
          python scripts/prepare_update_release.py
      - name: Upload reviewable signed distribution
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-signed-update
          path: update-distribution/
          if-no-files-found: error
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(python -c 'import json; print("v" + json.load(open("update-distribution/update.json"))["versionName"])')
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "車機桌面 $TAG" --notes-file docs/release-0.4.33.md update-distribution/*
