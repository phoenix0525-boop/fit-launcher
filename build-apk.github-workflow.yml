name: Build Android release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found under ANDROID_HOME"; exit 1; }
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify release configuration
        run: python scripts/verify_release_config.py
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Read app version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION" || { echo "::error::versionName not found"; exit 1; }
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      # Debug 版每次在新的 runner 用臨時金鑰簽章，無法覆蓋前一版；只供首次安裝測試。
      - name: Upload debug APK
        shell: bash
        run: mv app/build/outputs/apk/debug/app-debug.apk "fit-launcher-v${APP_VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fit-launcher-debug
          path: fit-launcher-v*-debug.apk
          if-no-files-found: error

      - name: Check signing secrets
        id: secrets
        env:
          FIT_KEYSTORE_BASE64: ${{ secrets.FIT_KEYSTORE_BASE64 }}
          FIT_KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
          FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$FIT_KEYSTORE_BASE64" ] && [ -n "$FIT_KEYSTORE_PASSWORD" ] && [ -n "$FIT_KEY_ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未設定簽章 Secrets（FIT_KEYSTORE_BASE64／FIT_KEYSTORE_PASSWORD／FIT_KEY_ALIAS），本次只產出 Debug APK。"
          fi

      - name: Prepare release signing key
        if: steps.secrets.outputs.ready == 'true'
        env:
          FIT_KEYSTORE_BASE64: ${{ secrets.FIT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$FIT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fit-launcher-release.p12"
          chmod 600 "$RUNNER_TEMP/fit-launcher-release.p12"
          echo "FIT_KEYSTORE_PATH=$RUNNER_TEMP/fit-launcher-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: steps.secrets.outputs.ready == 'true'
        env:
          FIT_KEYSTORE_PASSWORD: ${{ secrets.FIT_KEYSTORE_PASSWORD }}
          FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
          FIT_KEY_PASSWORD: ${{ secrets.FIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify release signature and identity
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          EXPECTED="52EE06F203BEA1460317B66170B99D07214B366E9A3A1E6F30D873E42C3835C6"
          test -f "$APK" || { echo "::error::Signed release APK is missing"; exit 1; }
          test -f "$AAB" || { echo "::error::Release AAB is missing"; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Release certificate does not match FIT launcher identity"; exit 1; }
          jarsigner -verify -strict "$AAB"
          mv "$APK" "fit-launcher-v${APP_VERSION}-release.apk"
          mv "$AAB" "fit-launcher-v${APP_VERSION}-release.aab"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fit-launcher-release.p12"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: fit-launcher-release
          path: |
            fit-launcher-v*-release.apk
            fit-launcher-v*-release.aab
            signature.txt
          if-no-files-found: error
